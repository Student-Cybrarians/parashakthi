<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parashakthi</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:rgba(15,15,20,.96);color:#f4f4f5;border:1px solid #27272a;border-radius:16px;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #27272a}.title{font-weight:700}.state{font-size:12px;color:#a1a1aa}.actions{display:flex;gap:8px;padding:12px}.actions button{flex:1;padding:9px;border:0;border-radius:10px;background:#27272a;color:#fff;cursor:pointer}.actions button.primary{background:#fafafa;color:#18181b}.controls{padding:0 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls label{font-size:11px;color:#a1a1aa;display:block;margin-bottom:5px}.controls select{width:100%;padding:8px;border-radius:9px;border:1px solid #3f3f46;background:#18181b;color:#fff}.hint{grid-column:1/-1;font-size:11px;color:#71717a}.section{padding:0 14px 12px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#71717a;margin:8px 0}.box{background:#18181b;border:1px solid #27272a;border-radius:10px;padding:10px;min-height:120px;max-height:220px;overflow:auto;white-space:pre-wrap}.answer{min-height:240px}.muted{color:#71717a}</style></head><body><header><div class="title">Parashakthi</div><div id="state" class="state">idle</div></header><div class="actions"><button id="start" class="primary">Start capture</button><button id="stop">Stop</button><button id="cancel">Cancel answer</button><button id="capture-screen">Screen</button></div><div class="actions"><button id="export">Export session</button><button id="reset-settings">Reset settings</button></div><div class="controls"><div><label for="device">Audio input</label><select id="device"><option value="">Default audio input</option></select></div><div><label for="mode">Assistant mode</label><select id="mode"><option value="interview">Interview</option><option value="coding">Coding</option><option value="system-design">System design</option><option value="behavioral">Behavioral</option></select></div><div><label for="style">Response style</label><select id="style"><option value="concise">Concise</option><option value="detailed">Detailed</option><option value="code-first">Code first</option><option value="explain">Explain</option></select></div><div><label for="asr">ASR provider</label><select id="asr"><option value="whisper">Whisper</option><option value="parakeet">Parakeet</option></select></div><div class="hint">Windows uses desktop loopback. macOS/Linux can use a virtual or monitor input. Session export is saved locally; no telemetry is sent to a remote service.</div></div><div class="section"><div class="label">Live transcript</div><div id="transcript" class="box muted">Waiting for interviewer audio…</div></div><div class="section"><div class="label">Assistant</div><div id="answer" class="box answer muted">Answers will stream here.</div></div><script src="renderer.js"></script></body></html>
